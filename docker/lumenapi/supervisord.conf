[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
environment=LUMEN_SETTINGS_KEY_FILE="/run/secrets/lumen_settings_key",LUMEN_INTEGRITY_KEY_FILE="/run/secrets/lumen_integrity_key"
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:renderer]
command=/usr/local/bin/node /opt/lumen-renderer/server.js
user=www-data
environment=HOME="/tmp",CHROMIUM_PATH="/usr/bin/chromium",RENDERER_HOST="127.0.0.1",RENDERER_PORT="3000"
priority=30
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:redis]
user=www-data
command=/bin/sh -c 'if [ "${REDIS_INTERNAL:-1}" = "1" ]; then exec /usr/local/bin/redis-server --bind 127.0.0.1 --protected-mode yes --appendonly no --dir /data --save 900 1 --save 300 10 --save 60 10000 --requirepass "$REDIS_PASSWORD"; else exec tail -f /dev/null; fi'
priority=30
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:watchdog]
command=/bin/sh -c "while true; do if [ -f /var/www/html/storage/install/install.lock ]; then php /var/www/html/scripts/integrity_watchdog.php || true; fi; sleep 1; done"
user=www-data
priority=40
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:dns-warm]
command=/bin/sh -c "while true; do if [ -f /var/www/html/storage/install/install.lock ]; then timeout 45 php /var/www/html/scripts/warm_upstream_dns.php || true; fi; sleep 60; done"
user=www-data
priority=40
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

