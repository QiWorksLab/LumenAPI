name: lumenapi

services:
  lumenapi:
    image: lumenapi:latest
    build:
      context: .
      dockerfile: docker/lumenapi/Dockerfile
      network: host
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: "${DB_HOST:-host.docker.internal}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: "${DB_NAME:-LumenAPI}"
      DB_USER: "${DB_USER:-LumenAPI}"
      DB_PASS: "${DB_PASS:-}"
      DB_PREFIX: "${DB_PREFIX:-api_}"
      REDIS_INTERNAL: "1"
      REDIS_HOST: "127.0.0.1"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DATABASE: "${REDIS_DATABASE:-0}"
      RENDERER_URL: http://127.0.0.1:3000/render
      LUMEN_INTEGRITY_KEY_FILE: /run/secrets/lumen_integrity_key
      LUMEN_SETTINGS_KEY_FILE: /run/secrets/lumen_settings_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LUMEN_BIND_IP:-127.0.0.1}:${LUMEN_WEB_PORT:-18080}:80"
    volumes:
      - "${LUMEN_PRIVATE_API_DIR:-./API}:/opt/lumenapi/private-handlers:ro"
      - redis_data:/data
      - lumen_runtime_logs:/var/www/html/runtime/log
      - lumen_sessions:/var/www/html/runtime/session
      - lumen_install:/var/www/html/storage/install
      - "${LUMEN_SECRETS_DIR:-/etc/lumenapi}/integrity.key:/run/secrets/lumen_integrity_key:ro"
      - "${LUMEN_SECRETS_DIR:-/etc/lumenapi}/settings.key:/run/secrets/lumen_settings_key:ro"
    tmpfs:
      - /var/www/html/runtime/temp:uid=33,gid=33,mode=0770
    shm_size: "256m"
    mem_limit: "1400m"
    pids_limit: 448
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthz >/dev/null && curl -fsS http://127.0.0.1:3000/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lumen_internal

networks:
  lumen_internal:
    name: lumenapi_lumen_internal
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16

volumes:
  redis_data:
  lumen_runtime_logs:
  lumen_sessions:
  lumen_install:
