<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据库配置 · LumenAPI</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eaf2ff;font-family:Inter,"Microsoft YaHei",sans-serif}.wrap{max-width:780px;margin:55px auto;padding:0 20px}.brand{font-size:30px;font-weight:800}.brand span{color:#6ed6ff}.card{margin-top:24px;padding:28px;background:#0d1a2c;border:1px solid #1b3553;border-radius:18px}h2{margin-top:0}.sub,.hint{color:#9bb0c9;font-size:14px;line-height:1.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.full{grid-column:1/-1}label{display:block;margin-bottom:7px;font-weight:600;font-size:14px}input{width:100%;background:#081524;border:1px solid #24405f;color:white;border-radius:9px;padding:12px;font-size:15px}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:26px}a{color:#87cfff}button{background:#39bdf8;color:#04111e;border:0;border-radius:9px;padding:12px 20px;font-weight:700;cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><main class="wrap"><div class="brand"><span>Lumen</span>API</div><p class="sub">安装向导 · 第 2 步 / 3 步</p><section class="card"><h2>配置并验证数据库</h2><p class="sub">填写已有 MySQL 数据库的连接信息。验证成功后进入管理员创建页面。不会覆盖非空数据库。</p>
<form action="/install/database/test" method="post" autocomplete="off"><div class="grid">
<div><label for="host">数据库地址</label><input id="host" name="host" value="{$dbHost|htmlentities}" placeholder="host.docker.internal" required><div class="hint">同一台服务器的 MySQL 建议填写 host.docker.internal</div></div>
<div><label for="port">端口</label><input id="port" name="port" type="number" min="1" max="65535" value="{$dbPort}" required></div>
<div><label for="database">数据库名称</label><input id="database" name="database" value="{$dbName|htmlentities}" required></div>
<div><label for="username">数据库用户名</label><input id="username" name="username" value="{$dbUser|htmlentities}" required></div>
<div class="full"><label for="password">数据库密码</label><input id="password" name="password" type="password" required autocomplete="new-password"></div>
</div><div class="footer"><a href="/install">返回环境检测</a><button type="submit">测试连接并继续</button></div></form><p class="hint">请先在 MySQL 中创建空数据库并授予该账号访问权限。数据库密码仅提交到服务器，不会显示在页面中。</p></section></main></body></html>
