<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创建管理员 · LumenAPI</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eaf2ff;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(920px,calc(100% - 32px));margin:56px auto}.brand{font-size:30px;font-weight:800}.brand span{color:#6ed6ff}.sub{margin-top:8px;color:#8ea5c2}.steps{display:flex;gap:8px;margin-top:25px}.step{font-size:13px;padding:7px 11px;border-radius:20px;background:#102039;color:#7e97b5}.step.on{background:#123e59;color:#70d8ff}.card{margin-top:18px;background:#0d1a2c;border:1px solid #1b3553;border-radius:18px;padding:28px;box-shadow:0 18px 60px rgba(0,0,0,.25)}h2{margin:0 0 8px}.meta{color:#7f96b3;font-size:14px;margin-bottom:22px}.dbok{padding:12px 14px;border:1px solid #1e554b;background:#0b2928;border-radius:10px;color:#75e5bd;font-size:13px;margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}input{width:100%;background:#081524;border:1px solid #24405f;color:#eaf2ff;border-radius:10px;padding:12px 13px;outline:none;font-size:14px}input:focus{border-color:#45bff5;box-shadow:0 0 0 3px rgba(69,191,245,.09)}.hint{color:#6983a1;font-size:12px;margin-top:7px}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding-top:22px;border-top:1px solid #1b3553}.back{color:#87a5c7;text-decoration:none}.button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;background:#39bdf8;color:#04111e;cursor:pointer}.notice{margin-top:18px;color:#728ba9;font-size:13px;line-height:1.7}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><div class="brand"><span>Lumen</span>API</div><div class="sub">统一 AI 模型 API 接入与管理平台 · 安装向导</div><div class="steps"><span class="step">1 环境检测</span><span class="step">2 数据库验证</span><span class="step on">3 管理员</span><span class="step">4 完成</span></div><section class="card"><h2>创建初始管理员</h2><div class="meta">这个账号将拥有 LumenAPI 的最高管理权限。</div><div class="dbok">✓ 数据库连接已验证：{$database} · MySQL {$mysqlVersion} · 当前 {$tableCount} 张表</div><form method="post" action="/install/initialize" autocomplete="off"><div class="grid"><div class="field full"><label>管理员用户名</label><input name="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" placeholder="例如：admin" required autocomplete="off"><div class="hint">3–32 位，仅允许字母、数字和下划线。</div></div><div class="field"><label>管理员密码</label><input type="password" name="password" minlength="10" required autocomplete="new-password"><div class="hint">至少 10 位；正式初始化时会使用 password_hash 安全存储。</div></div><div class="field"><label>确认密码</label><input type="password" name="password_confirm" minlength="10" required autocomplete="new-password"></div></div><div class="notice">下一步才会正式创建数据表和管理员。当前页面不会写入数据库。</div><div class="footer"><a class="back" href="/install/database">← 重新验证数据库</a><button class="button" type="submit">确认并初始化 LumenAPI</button></div></form></section></main></body></html>
